# IndustryPulse 配置文件
# 说明: 阈值基于历史分位数动态计算, 非主观设定, 避免过度拟合

# ========== 行业与股票池 ==========
industry:
  name: "新能源"
  sector: "光伏"          # 可选: 光伏 / 锂电池
  # 固定股票池 (解决成分股变动导致的 CSAD 不可比问题)
  # 使用某一时间点的成分股快照, 不随时间变化
  # symbol 格式: sz/sh 前缀 (新浪源 stock_zh_a_daily 要求)
  stock_pool:
    # 光伏
    - "sh600438"   # 通威股份
    - "sh601012"   # 隆基绿能
    - "sz002129"   # TCL中环
    - "sh688599"   # 天合光能
    - "sz300274"   # 阳光电源
    - "sh688223"   # 晶科能源
    - "sz002459"   # 晶澳科技
    - "sh600732"   # 爱旭股份
    - "sz300118"   # 东方日升
    - "sh688303"   # 大全能源
    # 锂电池
    - "sz300750"   # 宁德时代
    - "sz002594"   # 比亚迪
    - "sz002460"   # 赣锋锂业
    - "sz002466"   # 天齐锂业
    - "sh603659"   # 璞泰来
    - "sh688005"   # 容百科技
    - "sz300014"   # 亿纬锂能
    - "sz002709"   # 天赐材料
    - "sh600884"   # 杉杉股份
    - "sz002812"   # 恩捷股份
    # 风电/储能/其他
    - "sh601615"   # 明阳智能
    - "sz002202"   # 金风科技
    - "sh600893"   # 航发动力
    - "sz300124"   # 汇川技术
    - "sh600406"   # 国电南瑞
    - "sz002028"   # 思源电气
    - "sh688063"   # 派能科技
    - "sz300763"   # 锦浪科技
    - "sz300827"   # 上能电气
    - "sh688390"   # 固德威

# ========== 数据采集 ==========
data:
  start_date: "2020-01-01"
  end_date: "2026-08-18"
  db_path: "data/industry_pulse.db"
  # 混频处理: 日度市场指标捕捉短期情绪, 季度财务确认基本面趋势
  freq:
    market: "D"      # 日度: 行情/CSAD/Phi
    finance: "Q"     # 季度: 营收/净利润/ROE
    state: "M"       # 月度: 状态判断主频率

# ========== 指标计算 ==========
indicators:
  csad:
    window: 20          # 滚动窗口 (交易日)
    detrend: true       # 对 CSAD 做行业均值去趋势 (CSAD / 历史均值)
  phi:
    source: "credit_spread"   # credit_spread = 中债 AA-AAA 利差
    # Phi_t = BAA_yield - AAA_yield (海外) 或 AA-AAA 利差 (国内)
  vix:
    proxy: "ivix"      # A股波动率代理指标

# ========== 健康度打分 (三维度, 每维 -1/0/+1) ==========
health_score:
  momentum_score:    # 营收增速趋势: 加速=+1, 减速=-1
    accel: +1
    decel: -1
  dispersion_score:  # CSAD 分位数: 高位=-1, 低位=+1
    high_quantile: 0.80
    low_quantile: 0.20
  credit_score:      # Phi 分位数: 宽松=+1, 紧缩=-1
    tight_quantile: 0.80
    loose_quantile: 0.20
  # 综合健康度范围: -3 (最差) ~ +3 (最好)
  # 注: 分位数基于 2020-2024 历史数据计算

# ========== 行业周期四状态机 ==========
state_machine:
  # 从 GENESIS (NORMAL/DEFENSE) 扩展为四状态
  EXPANSION:         # 扩张期: 积极投资, 可承受高估值
    score_range: [2, 3]
    strategy: "积极投资, 可承受高估值"
  OVERHEAT:          # 过热期: 谨慎, 关注估值安全边际
    score_range: [0, 1]
    strategy: "谨慎, 关注估值安全边际"
  CONTRACTION:       # 收缩期: 观望或寻找困境反转
    score_range: [-2, -1]
    strategy: "观望, 或寻找困境反转机会"
  BOTTOMING:         # 筑底期: 布局, 抢在复苏前
    score_range: [-3, 0]
    strategy: "布局, 抢在复苏前"
  # 半马尔可夫: 状态持续时间服从分布, 非指数 (含记忆性)
  semi_markov:
    duration_model: "weibull"   # 停留时间分布
    min_state_hold: 3          # 最小状态保持期 (月), 防抖动
